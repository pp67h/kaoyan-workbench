<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>考研工作台</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fbf3e2;color:#3d3a36;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
  .box{text-align:center;padding:24px;animation:pop .28s ease-out both}
  .dog{font-size:46px;margin-bottom:10px;animation:breathe 1.2s ease-in-out infinite alternate}
  b{font-size:18px;letter-spacing:.04em}
  .tip{font-size:12px;color:#8b7d5c;margin-top:8px;opacity:.8;min-height:18px}
  @keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
  @keyframes breathe{from{transform:scale(1)}to{transform:scale(1.06)}}
</style>
<div class="box"><div class="dog">🫐</div><b>考研工作台</b><div class="tip" id="tip">加载中…</div></div>
<script>
(function(){
  var REMOTE_BASE='https://pp67h.github.io/kaoyan-workbench/';
  var REMOTE_URL=REMOTE_BASE+'index.html?';
  var tipEl=document.getElementById('tip');
  var done=false;
  var localTimer=null;

  function setTip(t){ try{ tipEl.textContent=t; }catch(_){} }
  function once(fn){ if(done) return; done=true; if(localTimer) clearTimeout(localTimer); fn(); }

  function loadLocal(){
    setTip('加载本地版本…');
    try{ location.replace('index.html?r='+Date.now()); }
    catch(e){ location.href='index.html?r='+Date.now(); }
  }

  function loadRemote(html){
    setTip('加载完成，正在进入…');
    try{
      // 注入 base 标签，确保相对路径资源正确加载
      html=html.replace(/<head([^>]*)>/i,'<head$1><base href="'+REMOTE_BASE+'">');
      document.open();
      document.write(html);
      document.close();
    }catch(e){
      // 写入失败，回退本地
      loadLocal();
    }
  }

  // 2.5 秒兜底：超时就进本地版
  localTimer=setTimeout(function(){
    setTip('网络较慢，用本地版本');
    once(loadLocal);
  }, 2500);

  // 尝试加载远程最新版（优先）
  setTip('正在加载最新版…');
  try{
    var ts=Date.now();
    fetch(REMOTE_URL+ts,{
      cache:'no-store',
      mode:'cors',
      credentials:'omit'
    })
    .then(function(r){
      if(!r.ok) throw new Error('HTTP '+r.status);
      return r.text();
    })
    .then(function(html){
      if(!html || html.length<500) throw new Error('内容为空');
      once(function(){ loadRemote(html); });
    })
    .catch(function(e){
      // 远程失败，立即回退本地
      setTip('连接失败，用本地版本');
      once(loadLocal);
    });
  }catch(e){
    setTip('加载出错，用本地版本');
    once(loadLocal);
  }
})();
</script>
